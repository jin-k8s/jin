# Read-only access for Jin: plan, verify, blue/green compare and migration assessment.
# Bind it to the identity Jin uses (on EKS: an access entry or aws-auth mapping; on GKE/AKS: a
# Kubernetes RBAC binding for the user or group).
#
# Secrets: Helm stores releases as Secrets and RBAC cannot filter by label, so reading Helm
# releases requires list on all Secrets. Jin only decodes secrets labelled owner=helm and keeps
# apiVersion/kind/name of the rendered objects. To avoid granting this, delete the Secrets rule and
# run `jin plan --skip-helm`.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: jin-readonly
rules:
  - apiGroups: [""]
    resources: [nodes, namespaces, serviceaccounts, services, persistentvolumeclaims]
    verbs: [get, list]
  - apiGroups: [""]
    resources: [secrets]
    verbs: [list]
  - apiGroups: [apps]
    resources: [deployments, daemonsets, statefulsets, replicasets]
    verbs: [get, list]
  - apiGroups: [policy]
    resources: [poddisruptionbudgets]
    verbs: [list]
  # Resources whose kinds have removed API versions, plus storage/ingress classes and CRDs.
  - apiGroups:
      - admissionregistration.k8s.io
      - apiextensions.k8s.io
      - apiregistration.k8s.io
      - autoscaling
      - batch
      - certificates.k8s.io
      - coordination.k8s.io
      - discovery.k8s.io
      - flowcontrol.apiserver.k8s.io
      - networking.k8s.io
      - node.k8s.io
      - rbac.authorization.k8s.io
      - scheduling.k8s.io
      - storage.k8s.io
    resources: ["*"]
    verbs: [list]
  # Secret backends for migration assessments (only their provider type is read).
  - apiGroups: [external-secrets.io, secrets-store.csi.x-k8s.io]
    resources: [secretstores, clustersecretstores, secretproviderclasses]
    verbs: [list]
  - nonResourceURLs: [/metrics]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: jin-readonly
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: jin-readonly
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: Group
    name: jin:readonly
